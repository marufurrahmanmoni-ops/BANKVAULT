name: Build APK

on:
  push:
    branches: [ "main", "claude/**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest ships an Android SDK with accepted licences; AGP downloads platform 36 if needed.
      - name: Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - uses: gradle/actions/setup-gradle@v4

      - name: Core security unit tests
        run: ./gradlew --no-daemon :core:test

      - name: Build debug APKs (BANKVAULT + TestBank)
        run: ./gradlew --no-daemon :app:assembleDebug :testbank:assembleDebug

      - name: Upload BANKVAULT debug APK
        uses: actions/upload-artifact@v4
        with:
          name: bankvault-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload TestBank debug APK
        uses: actions/upload-artifact@v4
        with:
          name: testbank-debug-apk
          path: testbank/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: core/build/reports/tests/
          if-no-files-found: ignore

  emulator-smoke-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api-level: [34, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: bankvault-debug-apk, path: apk/app }
      - uses: actions/download-artifact@v4
        with: { name: testbank-debug-apk, path: apk/testbank }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run end-to-end smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: python3 tools/ci/smoke.py "$(ls apk/app/*.apk | head -1)" "$(ls apk/testbank/*.apk | head -1)"
      - name: Upload smoke-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-api${{ matrix.api-level }}
          path: out/
